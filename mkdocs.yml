site_name: "Agentic AI Learning Lab"
site_description: "A personal engineering learning laboratory for Agentic AI and software engineering."

repo_url: https://github.com/shendesuchit/learning-agentic-ai-demo
repo_name: shendesuchit/learning-agentic-ai-demo
edit_uri: edit/main/docs/

theme:
  name: material
  language: en

  icon:
    repo: fontawesome/brands/github
    logo: material/flask-outline

  favicon: assets/images/favicon.png

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.share
    - search.suggest

  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search
  - awesome-pages
  - tags:
      tags_file: tags.md

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

site_name: "Dhyey's Learning Lab"
site_description: "A personal engineering learning laboratory for Agentic AI and software engineering."

theme:
  name: material
  language: en

  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.share

  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Agentic AI:
      - Overview: agentic-ai/index.md

  - Frameworks:
      - LangChain:
          - Introduction: frameworks/langchain/introduction.md
          - Middleware:
              - Overview: frameworks/langchain/middleware/overview.md
              - Custom Middleware: frameworks/langchain/middleware/custom.md
              - Predefined Middleware: frameworks/langchain/middleware/predefined.md

      - LangGraph:
          - Introduction: frameworks/langgraph/introduction.md

  - Examples:
      - Overview: examples/index.md

  - Visualizations:
      - Overview: visualizations/index.md

  - Handwritten Notes:
      - Overview: handwritten-notes/index.md

  - References:
      - Overview: references/index.md

  - Discussions:
      - Overview: discussions/index.md
